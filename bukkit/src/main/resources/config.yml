# Velto - Configuration file
# Config generated by Velto 0.7.0
#
#
# Configure the spawn point related to /spawn command
spawn: null
#
#
# AFK system
# Time in seconds before a player is marked as AFK (default: 300 = 5 minutes)
afk-timeout-seconds: 300
#
#
# AFK Zone
afkzone:
  enabled: false
  location:
    world: world
    x: 0
    y: 0
    z: 0
# Teleport countdown
# countdown.default: seconds to wait before teleporting (0 = instant)
# countdown.permissions: first matching permission wins (list in priority order)
# cancel-on-move: cancel the teleport if the player moves a block during countdown
teleport:
  cancel-on-move: true
  countdown:
    default: 5
    permissions:
      velto.teleport.instant: 0
#
#
# TPA - teleport request system
# expire-seconds: how long before an unanswered request is automatically cancelled
tpa:
  expire-seconds: 60
#
#
# /back world blacklist
# Players cannot use /back if their previous location was in one of these worlds
back:
  blacklisted-worlds:
    - world_nether
    - world_the_end
#
#
# Homes
# default-limit: floor for how many homes a player may set (with no bonus permission).
# Add velto.homes.bonus.<name>.<amount> permissions to stack extra homes on top
# (e.g. velto.homes.bonus.vip.3 adds 3), or velto.homes.unlimited to remove the cap.
homes:
  default-limit: 3
#
#
# Userdata
# How often player data is flushed to disk (in seconds). Default: 300 (5 minutes)
userdata:
  autosave-interval-seconds: 300
#
#
# Auto-messaging system
auto-messages:
  enabled: true
  interval-seconds: 120
  random: true
  messages:
    - automsg1
    - automsg2
    - automsg3

messages:
  # REQUIRED fallback chat format
  chat: "&7%player_name%&8: &f%message%"

  # Optional join/quit (your existing keys)
  join: "&e%player_name% joined the game."
  quit: "&c%player_name% left the game."
  reload: "&aChat configuration reloaded."

  # Optional: order of groups (first match wins)
  chat-priority:
    - owner
    - admin
    - mod
    - vip

  # Optional: define any groups you want
  chat-groups:
    owner:
      permission: "veltobukkit.chat.owner"
      format: "&4[OWNER] &f%player_name%&7: &f%message%"

    admin:
      permission: "veltobukkit.chat.admin"
      format: "&c[ADMIN] &f%player_name%&7: &f%message%"

    mod:
      permission: "veltobukkit.chat.mod"
      format: "&2[MOD] &f%player_name%&7: &f%message%"

    vip:
      permission: "veltobukkit.chat.vip"
      format: "&6[VIP] &f%player_name%&7: &f%message%"

