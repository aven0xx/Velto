# ============================================================================
#  Velto — Language / Messages
# ============================================================================
#  Message types:  chat · actionbar · title · bossbar
#
#  Colors:  legacy &-codes (&a, &c, …) AND hex &#RRGGBB (1.16+) both work.
#  Interactivity (chat type only):
#    hover: "..."                         tooltip shown on mouse-over
#    click: { action, value }             action: run_command | suggest_command
#                                                  | open_url | copy_to_clipboard
#    segments: [...]                      multiple independently styled/clickable spans
#
#  Placeholders (e.g. %player%, %amount%, %home%) are filled in by the plugin —
#  keep them exactly as they appear. Message keys must not be renamed.
#
#  Palette used below (change these hex values to re-theme the whole plugin):
#    Brand / syntax   &#5AC8FA        Success   &#57E39A        Error   &#FF7070
#    Warning / prompt &#FFC857        Value     &#F1F1F1        Muted   &#8A94A6
#    Money            &#FFD64A
# ============================================================================

